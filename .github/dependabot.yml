version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 5
    ignore:
      # Next 16's current lint stack uses typescript-eslint, which does not yet
      # support the TypeScript 7 compiler API. Keep these majors pinned until
      # eslint-config-next declares a compatible toolchain.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Atlantic/Reykjavik
    open-pull-requests-limit: 3
